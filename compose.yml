services:
  error-collector:
    build: .
    image: futureys/error-collector:development
    volumes:
      - .:/workspace
      - /workspace/.venv
      # - Using uv in Docker | uv
      #   https://docs.astral.sh/uv/guides/integration/docker/#caching
      - uv-cache:/root/.cache/uv
volumes:
  uv-cache:
